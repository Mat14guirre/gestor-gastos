<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gestor de Gastos</title>
  <link rel="stylesheet" href="estilo.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <h1>Control de gastos</h1>
  <div id="saludo" class="saludo"></div>
  <!-- BOTONES LOGIN / LOGOUT -->
  <div id="auth-buttons" class="botones-center">
    <button id="login-btn">Iniciar sesión con Google</button>
    <button id="logout-btn" style="display:none;">Cerrar sesión</button>
  </div>
  

  <section class="resumen">
    <h2>Resumen</h2>
    <label for="ingreso">Ingreso mensual:</label>
    <input type="number" id="ingreso" value="0" />

    <label for="meta">Meta de ahorro:</label>
    <input type="number" id="meta" value="0" />

    <p><strong>Total Gastado:</strong> $<span id="totalGasto">0</span></p>
    <p><strong>Ahorro Real:</strong> $<span id="ahorroReal">0</span></p>
    <p><strong>Meta Cumplida:</strong> <span id="cumplida">❌</span></p>

  </section>

  <section class="formulario">
    <h2>Agregar Gasto</h2>

    <label for="fecha">Fecha:</label>
    <input type="date" id="fecha" />

    <label for="categoria">Categoría:</label>
    <select id="categoria">
      <option value="Comida">Comida</option>
      <option value="Transporte">Transporte</option>
      <option value="Entretenimiento">Entretenimiento</option>
      <option value="Salud">Salud</option>
      <option value="Servicios">Servicios</option>
      <option value="Hogar">Hogar</option>
      <option value="Ahorro">Ahorro</option>
      <option value="Otros">Otros</option>
    </select>

    <label for="monto">Monto:</label>
    <input type="number" id="monto" />

    <label for="metodo">Método de pago:</label>
    <input type="text" id="metodo" />

    <label for="observaciones">Observaciones:</label>
    <textarea id="observaciones"></textarea>

    <button class="botones-center" id="agregar-btn">Agregar</button>
  </section>

  <section class="tabla">
    <h2>Gastos</h2>
    <table id="tablaGastos">
      <thead>
        <tr>
          <th>Fecha</th>
          <th>Categoría</th>
          <th>Monto</th>
          <th>Método</th>
          <th>Obs.</th>
          <th></th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>

  <section class="grafico">
    <h2>Gráfico por Categoría</h2>
    <canvas id="graficoGastos"></canvas>
  </section>
  <button id="reiniciar-btn" class="reiniciar-btn">🧹 Reiniciar gastos / borrar todo</button>
  <script type="module" src="app.js"></script>
</body>
</html>
